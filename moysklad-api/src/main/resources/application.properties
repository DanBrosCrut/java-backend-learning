# --- Actuator ---
management.endpoints.web.exposure.include=health,info

# --- Application info ---
info.app.version=@project.version@
# Spring Boot 4 disables the environment info contributor by default
management.info.env.enabled=true

# --- Logging: include correlation ID in console output ---
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [%X{correlationId}] - %msg%n

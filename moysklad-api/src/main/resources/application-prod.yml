# --- Prod profile ---
# Production configuration. Activate with SPRING_PROFILES_ACTIVE=prod

logging:
  level:
    # Stricter logging: warnings and errors only
    com.example.moysklad.api: WARN
    org.springframework: WARN
    org.springframework.web: WARN

# API docs are development-only
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# MoySklad API (values supplied via environment / secrets manager)
moysklad:
  token: ${MOYSKLAD_TOKEN}
  base-url: ${MOYSKLAD_BASE_URL:https://api.moysklad.ru/api/remap/1.2}

# --- Prod profile ---
# Production configuration. Activate with SPRING_PROFILES_ACTIVE=prod

# Stricter logging: warnings and errors only
logging.level.com.example.moysklad.api=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.web=WARN

# API docs are development-only
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# MoySklad API (values supplied via environment / secrets manager)
moysklad.token=${MOYSKLAD_TOKEN}
moysklad.base-url=${MOYSKLAD_BASE_URL:https://api.moysklad.ru/api/remap/1.2}

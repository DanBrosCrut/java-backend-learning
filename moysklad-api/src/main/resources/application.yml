spring:
  config:
    import: "optional:file:../.env[.properties]"

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

# --- Application info ---
info:
  app:
    version: "@project.version@"

# --- Logging: include correlation ID in console output ---
logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [%X{correlationId}] - %msg%n'

# --- MoySklad API ---
moysklad:
  token: ${MOYSKLAD_TOKEN}
  base-url: https://api.moysklad.ru/api/remap/1.2
  # Remap returns at most 1000 rows per request; the client reads the catalog page by page.
  assortment-page-size: 1000
  stock-cache:
    # A stock snapshot younger than this is served without any request to MoySklad.
    ttl: PT5M
    # After this time since the last full report the cache always reloads in full.
    full-sync-interval: PT24H
